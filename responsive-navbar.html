<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        .navbar { display: flex; align-items: center; justify-content: space-between; background: #1f2937; color: white; padding: 10px 20px; }
        .brand { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 18px; list-style: none; margin: 0; padding: 0; }
        .nav-links a { color: white; text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .nav-links a:hover { color: #93c5fd; }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .hero { padding: 60px 20px; text-align: center; background: #f3f4f6; }
        .hero h1 { margin: 0 0 14px; font-size: 34px; color: #111827; }
        .hero p { margin: 0; color: #4b5563; font-size: 16px; line-height: 1.6; max-width: 600px; margin-left: auto; margin-right: auto; }
        @media (max-width: 680px) {
            .nav-links { position: absolute; top: 60px; left: 0; right: 0; background: #111827; flex-direction: column; gap: 0; display: none; }
            .nav-links.show { display: flex; }
            .nav-links li { border-top: 1px solid #374151; }
            .nav-links a { padding: 14px 20px; }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">My Website</div>
        <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    <section class="hero" id="home">
        <h1>Responsive Navigation Bar</h1>
        <p>Resize the browser window to see the navigation collapse into a mobile-friendly menu. This navbar works on small screens and large screens with simple HTML and CSS layout.</p>
    </section>
    <script>
        const toggle = document.querySelector('.menu-toggle');
        const links = document.querySelector('.nav-links');
        toggle.addEventListener('click', () => links.classList.toggle('show'));
    </script>
    <footer>
        @clevision.com
    </footer>
</body>
</html>
